# Render Blueprint: one web service (API + React app) and one Postgres database.
services:
  - type: web
    name: reveiller-books
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: BUSINESS_TZ
        value: America/Toronto
      - key: DATABASE_URL
        fromDatabase:
          name: reveiller-books-db
          property: connectionString
      - key: SETUP_TOKEN
        generateValue: true
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false

databases:
  - name: reveiller-books-db
    plan: basic-256mb
    region: ohio
    databaseName: reveiller_books
    user: reveiller
    postgresMajorVersion: "16"
